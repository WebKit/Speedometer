name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

permissions:
    contents: read

env:
    NPM_CONFIG_IGNORE_SCRIPTS: "true"
    NPM_CONFIG_AUDIT: "false"
    NPM_CONFIG_FUND: "false"

jobs:
    linters:
        name: Linters
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout Branch
              uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: "package.json"
                  cache: "npm"

            - name: Install Node Packages
              run: npm ci --ignore-scripts

            - name: Run package.json linter
              run: npm run lint:pkg

            - name: Run linters
              run: npm run format

            - name: Check if anything changed
              run: |
                  git_status="`LC_ALL=C git status --porcelain --ignore-submodules -unormal 2>&1`"
                  if [ -n "$git_status" ]; then
                      printf "Some file(s) changed as the result of formatting, this means that you need to run the formatter on your patch.\n"
                      printf "Here is what changed:\n"
                      printf "%s\n\n" "$git_status"
                      printf "And here is the diff:\n"
                      git diff -U8
                      exit 1
                  fi

    test-node:
        name: Node Unit Tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout Branch
              uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: "package.json"
                  cache: "npm"

            - name: Install Node Packages
              run: npm ci --ignore-scripts

            - name: Run Node Unit Tests
              run: npm test

    build:
        name: Build
        runs-on: ${{ matrix.os }}
        timeout-minutes: 30
        strategy:
            matrix:
                include:
                    - browser: chrome
                      os: ubuntu-latest
                    - browser: firefox
                      os: ubuntu-latest
                    - browser: safari
                      os: macos-latest
        env:
            BROWSER: ${{ matrix.browser }}
        steps:
            - name: Checkout Branch
              uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: "package.json"
                  cache: "npm"

            - name: Install Node Packages
              run: npm ci --ignore-scripts

            - name: Run Unit Tests
              run: |
                  echo "Running in $BROWSER"
                  npm run "test:$BROWSER"

            - name: Run end2end Tests
              run: |
                  echo "Running in $BROWSER"
                  npm run "test-e2e:$BROWSER"
